name: CI

# Quality checks for the Claude-HTB-SKILL repository:
#  - shellcheck on all .sh scripts
#  - Python lint (ruff) + compilation of the generator
#  - validation of the SKILL.md frontmatter and the ATT&CK Navigator layer
#  - verification that the layer JSON is well-formed

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint the .sh scripts
        run: |
          set -e
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*')
          echo "Scripts analyzed:"; printf '  %s\n' "${files[@]}"
          # .shellcheckrc at the root provides the configuration (external-sources, disables).
          shellcheck --severity=warning "${files[@]}"
      - name: Check syntax (bash -n)
        run: |
          for f in $(find . -type f -name '*.sh' -not -path './.git/*'); do
            bash -n "$f" && echo "OK  $f"
          done

  python:
    name: Python (lint + generator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet ruff pyyaml
      - name: Lint ruff
        run: ruff check skills/htb-workflow/gen-navigator-layer.py tools/validate.py
      - name: Compilation
        run: python -m py_compile skills/htb-workflow/gen-navigator-layer.py tools/validate.py

  validate:
    name: Validation (skills + ATT&CK layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Validate frontmatter, JSON layer and generator
        run: python tools/validate.py
      - name: Check that the layer JSON parses
        run: python -c "import json; json.load(open('skills/htb-workflow/attack-navigator-layer.template.json', encoding='utf-8')); print('layer JSON OK')"
